name: Build OpenAI IP HAP

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ohos-openai-ip-v0.8.94-20260829

jobs:
  build-hap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup OpenHarmony SDK
        uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: 6.1.1.280
          cache: true

      - name: Setup Flutter for OpenHarmony
        run: |
          git clone -b oh-3.41.9-release --depth 1 https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TOOL_CACHE/flutter-ohos"
          git -C "$RUNNER_TOOL_CACHE/flutter-ohos" tag 3.41.10
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TOOL_CACHE/flutter-ohos/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies and generate code
        run: |
          flutter --version
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build --delete-conflicting-outputs

      - name: Format migrated Dart sources
        run: |
          dart format \
            lib/common/request.dart \
            lib/manager/app_manager.dart \
            lib/models/common.dart \
            lib/providers/action.dart \
            lib/providers/app.dart \
            lib/providers/state.dart \
            lib/views/dashboard/widgets/ip_detection_card.dart \
            lib/views/dashboard/widgets/network_detection.dart \
            lib/views/dashboard/widgets/open_ai_detection.dart \
            lib/views/dashboard/widgets/widgets.dart \
            test/common/openai_request_test.dart \
            test/models/openai_ip_test.dart \
            test/providers/openai_detection_test.dart \
            test/widgets/ip_detection_card_test.dart \
            test/widgets/open_ai_detection_test.dart

      - name: Upload generated source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-OHOS-OpenAI-IP-v0.8.94-20260829-generated
          path: |
            lib
            test
          if-no-files-found: error
          retention-days: 14

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/common/request.dart \
            lib/manager/app_manager.dart \
            lib/models/common.dart \
            lib/providers/action.dart \
            lib/providers/app.dart \
            lib/providers/state.dart \
            lib/views/dashboard/widgets/ip_detection_card.dart \
            lib/views/dashboard/widgets/network_detection.dart \
            lib/views/dashboard/widgets/open_ai_detection.dart \
            lib/views/dashboard/widgets/widgets.dart \
            test/common/openai_request_test.dart \
            test/models/openai_ip_test.dart \
            test/providers/openai_detection_test.dart \
            test/widgets/ip_detection_card_test.dart \
            test/widgets/open_ai_detection_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup OpenHarmony Go
        run: |
          git clone -b release-branch.go1.24 --depth 1 https://gitcode.com/openharmony-sig/ohos_golang_go.git "$HOME/ohos-go"
          cd "$HOME/ohos-go/src"
          ./make.bash
          echo "GOROOT=$HOME/ohos-go" >> "$GITHUB_ENV"
          echo "$HOME/ohos-go/bin" >> "$GITHUB_PATH"

      - name: Build unsigned HAP
        run: dart setup.dart ohos --targets hap --env stable -v

      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-OHOS-OpenAI-IP-v0.8.94-20260829-unsigned
          path: dist/*.hap
          if-no-files-found: error
          retention-days: 14
